[tool.ruff]
target-version = "py312"
line-length = 88
exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "DJ"]
ignore = ["E501"]

[tool.coverage.run]
branch = true
source = ["accounts", "config", "tracker"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
